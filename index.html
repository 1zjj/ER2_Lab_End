<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6df6">
  <meta name="description" content="ER² Lab 学生、教师与管理者的一页式飞书工作台">
  <title>ER² Lab 工作台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <a class="brand" href="#home" aria-label="返回 ER² Lab 工作台首页">
        <span class="brand-mark">ER²</span>
        <span class="brand-copy"><strong>ER² Lab</strong><small>统一工作台</small></span>
      </a>

      <form class="search" id="global-search" role="search">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索课程、项目、设备 SOP" aria-label="搜索课程、项目、设备 SOP">
        <button type="submit">搜索</button>
      </form>

      <div class="account">
        <div class="avatar" id="account-avatar" aria-hidden="true">A</div>
        <div class="account-copy"><strong id="account-name">正在识别身份</strong><small id="account-role">飞书账号</small></div>
      </div>
    </div>
  </header>

  <nav class="viewbar" aria-label="角色工作台">
    <div class="viewbar-inner" id="role-nav"></div>
  </nav>

  <main class="workspace">
    <div class="environment-notice" id="environment-notice" hidden>
      <strong>演示模式</strong><span>当前使用示例数据；接入飞书后会自动显示登录者本人内容。</span>
    </div>

    <section class="loading-state" id="loading-state" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <strong>正在读取你的工作台…</strong>
      <small>正在确认飞书身份和访问权限</small>
    </section>

    <section class="error-state" id="error-state" hidden role="alert">
      <span>!</span>
      <div><strong id="error-title">工作台暂时无法载入</strong><p id="error-message"></p></div>
      <button type="button" id="retry-button">重新载入</button>
    </section>

    <div id="app-root" hidden></div>
  </main>

  <nav class="mobile-nav" id="mobile-role-nav" aria-label="移动端角色工作台"></nav>

  <dialog class="modal" id="report-dialog">
    <form id="report-form">
      <div class="modal-head">
        <div><p class="kicker">WEEKLY RECORD</p><h2>填写本周工作记录</h2><p id="report-week-label"></p></div>
        <button class="icon-button" type="button" data-close-dialog="report-dialog" aria-label="关闭">×</button>
      </div>
      <div class="form-body">
        <label>本周完成与结果<textarea name="progress" required rows="4" placeholder="完成了什么？结果和结论是什么？"></textarea></label>
        <label>学习与方法<textarea name="learning" rows="3" placeholder="学习了哪些课程、工具或方法？"></textarea></label>
        <label>产出证据或飞书文件链接<input name="evidence" type="url" placeholder="https://...（大文件请先上传飞书云盘）"></label>
        <label>当前问题与阻塞<textarea name="blockers" rows="3" placeholder="现象、已尝试的方法和需要的帮助"></textarea></label>
        <label>下周计划<textarea name="nextPlan" required rows="3" placeholder="下一步任务和预计完成时间"></textarea></label>
        <p class="form-error" id="report-error" role="alert" hidden></p>
      </div>
      <div class="modal-actions">
        <button class="button button-secondary" type="button" data-close-dialog="report-dialog">取消</button>
        <button class="button button-primary" id="report-submit" type="submit">提交本周记录</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal literature-modal" id="literature-dialog">
    <form id="literature-form">
      <div class="modal-head">
        <div><p class="kicker">LITERATURE READING</p><h2>提交文献阅读</h2><p id="literature-week-label"></p></div>
        <button class="icon-button" type="button" data-close-dialog="literature-dialog" aria-label="关闭">×</button>
      </div>
      <div class="form-body literature-form-grid">
        <label class="field-wide">论文标题 *<input name="title" required maxlength="500" placeholder="请输入论文完整标题"></label>
        <label>作者<input name="authors" maxlength="1000" placeholder="例如：A. Author, B. Author"></label>
        <label>会议或期刊<input name="venue" maxlength="500" placeholder="例如：ICRA 2026"></label>
        <label>发表年份<input name="year" type="number" min="1800" max="2200" placeholder="2026"></label>
        <label>阅读类型<select name="type"><option value="精读">精读</option><option value="泛读">泛读</option><option value="复现">复现</option><option value="综述">综述</option></select></label>
        <label>研究方向<input name="direction" maxlength="300" placeholder="语义导航 / 规划控制 / 具身智能…"></label>
        <label>DOI 或 arXiv<input name="doi" maxlength="300" placeholder="10.xxxx/… 或 arXiv:xxxx.xxxxx"></label>
        <label class="field-wide">论文网页链接<input name="paperUrl" type="url" placeholder="https://..."></label>
        <label class="field-wide">一句话贡献 *<textarea name="contribution" required maxlength="1200" rows="2" placeholder="这篇论文解决了什么问题，最重要的贡献是什么？"></textarea></label>
        <label class="field-wide">核心问题<textarea name="coreProblem" maxlength="3000" rows="3" placeholder="研究问题、假设和适用边界"></textarea></label>
        <label class="field-wide">方法摘要<textarea name="method" maxlength="5000" rows="4" placeholder="关键方法、模型、数据和实验设置"></textarea></label>
        <label>个人评价<textarea name="review" maxlength="3000" rows="3" placeholder="优点、不足和可信度"></textarea></label>
        <label>与项目关系<textarea name="projectRelation" maxlength="3000" rows="3" placeholder="能用于哪个项目或实验？"></textarea></label>
        <label class="field-wide">飞书阅读笔记链接 *<input name="noteUrl" type="url" required placeholder="https://...（表格、公式和图片写在飞书文档内）"></label>
        <label class="field-wide">论文附件或飞书云盘链接<input name="attachmentUrl" type="url" placeholder="https://...（PDF/大文件先上传飞书）"></label>
        <p class="form-hint field-wide">一周至少提交 3 篇，但不限制上限；所有已登录的学生、教师和管理员都可以提交并互相查看。</p>
        <p class="form-error field-wide" id="literature-error" role="alert" hidden></p>
      </div>
      <div class="modal-actions">
        <button class="button button-secondary" type="button" data-close-dialog="literature-dialog">取消</button>
        <button class="button button-primary" id="literature-submit" type="submit">提交阅读记录</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal search-modal" id="search-dialog">
    <div class="modal-head">
      <div><p class="kicker">SEARCH</p><h2>搜索结果</h2><p id="search-summary"></p></div>
      <button class="icon-button" type="button" data-close-dialog="search-dialog" aria-label="关闭">×</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>

name: Deploy ER2 Workbench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify frontend
        run: |
          node --check app.js
          node --check config.js
          node --check draft-store.js
          node --check guide-store.js
          node --check learning-center.js
          node --check finance.js
          node --check sw.js
          node tests/weekly-ui.test.mjs
          node tests/member-guide.test.mjs
          node tests/course-capability.test.mjs
          node tests/diagnostics-ui.test.mjs
          test -f index.html
          test -f styles.css
          test -f data/catalog.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Wait for compatible weekly backend
        timeout-minutes: 8
        run: node scripts/check-weekly-backend.mjs
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js config.js draft-store.js guide-store.js learning-center.js learning-center.css finance.js finance.css favicon.svg sw.js _site/
          node -e 'const fs=require("fs");const html=fs.readFileSync("_site/index.html","utf8");for(const match of html.matchAll(/<script[^>]+src="\.\/([^"?]+)/g)){if(!fs.existsSync("_site/"+match[1]))throw new Error("Missing script: "+match[1]);}'
          cp -R data _site/data
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
